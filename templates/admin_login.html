```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SHREE SHYAM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101827;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 35px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h2 {
            color: #172033;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e09b17;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #e09b17;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c98508;
        }

        .register {
            margin-top: 22px;
            color: #555;
        }

        .register a {
            display: inline-block;
            margin-top: 8px;
            color: #d18b08;
            font-weight: bold;
            text-decoration: none;
        }

        .private-note {
            margin-top: 22px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img src="{{ url_for('static', filename='images/shree-shyam-logo.svg') }}"
         class="logo" alt="SHREE SHYAM Logo">

    <h2>Welcome, Admin</h2>

    <p class="subtitle">Sign in to manage SHREE SHYAM.</p>

    <form method="POST" action="{{ url_for('admin_login') }}">

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter password" required>
        </div>

        <button type="submit">Sign In</button>

    </form>

    <div class="register">
        New user? Create your account here.
        <br>
        <a href="{{ url_for('register') }}">New Registration</a>
    </div>

    <p class="private-note">
        Admin login credentials should be kept private.
    </p>

</div>

</body>
</html>
```
