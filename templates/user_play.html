
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SHREE SHYAM - Play Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f8;
        }

        header {
            background: #332477;
            color: white;
            padding: 18px;
        }

        header a {
            color: white;
            float: right;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000010;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 16px;
            background: white;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #5635bd;
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        .message {
            color: #b42318;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<header>
    <strong>SHREE SHYAM - Demo Play</strong>
    <a href="{{ url_for('user_dashboard') }}">Dashboard</a>
</header>

<div class="container">
    <div class="card">

        <h2>Play Demo Game</h2>

        <p>
            Available Demo Points:
            <strong>{{ user.points }}</strong>
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Select Market</label>
            <select name="market_id" required>
                <option value="">Choose Market</option>
                {% for market in markets %}
                    <option value="{{ market.id }}">
                        {{ market.name }}
                    </option>
                {% endfor %}
            </select>

            <label>Select Game Type</label>
            <select name="game_type" required>
                <option value="">Choose Game</option>
                {% for game in game_rates %}
                    <option value="{{ game.game_name }}">
                        {{ game.game_name }} - Rate {{ game.rate }}
                    </option>
                {% endfor %}
            </select>

            <label>Select Session</label>
            <select name="session" required>
                <option value="">Choose Session</option>
                <option value="Open">Open</option>
                <option value="Close">Close</option>
            </select>

            <label>Enter Demo Selection</label>
            <input
                type="text"
                name="selection"
                placeholder="Enter demo selection"
                maxlength="255"
                required
            >

            <label>Demo Points to Use</label>
            <input
                type="number"
                name="points_used"
                min="0.01"
                step="0.01"
                max="{{ user.points }}"
                placeholder="Enter demo points"
                required
            >

            <button type="submit">Submit Demo Game</button>

        </form>

    </div>
</div>

</body>
</html>
