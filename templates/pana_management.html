
{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">Pana Numbers</h2>

    <div class="card mb-4">
        <div class="card-body">
            <h5>Add Pana Numbers</h5>
            <form method="POST" action="{{ url_for('pana_add') }}">
                <textarea name="numbers"
                          class="form-control mb-3"
                          rows="5"
                          placeholder="128&#10;137&#10;146"
                          required></textarea>
                <button type="submit" class="btn btn-primary">
                    Add Numbers
                </button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5>Pana Number List</h5>
            <div class="d-flex flex-wrap gap-2">
                {% for item in pana_numbers %}
                    <span class="badge bg-light text-dark border p-3"
                          style="font-size:18px;">
                        {{ item.number }}
                    </span>
                {% else %}
                    <p>No Pana numbers added yet.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
