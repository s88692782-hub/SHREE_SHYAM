
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Registration - SHREE SHYAM</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-body">

<div class="login-card">

    <div class="login-logo"><img src="{{ url_for('static', filename='images/shree-shyam-logo.svg') }}" alt="SHREE SHYAM" style="width:100%;height:100%;object-fit:contain"></div>

    <h1>New Registration</h1>
    <p class="muted">Create your SHREE SHYAM account.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" class="form-stack">

        <label>Full Name
            <input type="text" name="name" required>
        </label>

        <label>Username
            <input type="text" name="username" required>
        </label>

        <label>Mobile Number
            <input type="tel" name="phone">
        </label>

        <label>Email
            <input type="email" name="email">
        </label>

        <label>Password
            <input type="password" name="password"
                   minlength="8" required>
        </label>

        <label>Confirm Password
            <input type="password" name="confirm_password"
                   minlength="8" required>
        </label>

        <button class="btn primary full" type="submit">
            Create Account
        </button>

    </form>

    <p class="muted" style="margin-top:20px;">
        Already registered?
        <a href="{{ url_for('user_login') }}">User Login</a>
    </p>

</div>

</body>
</html>
